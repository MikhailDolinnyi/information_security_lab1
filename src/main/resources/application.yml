spring:
  application:
    name: secure-api
  datasource:
    url: jdbc:h2:mem:securedb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true

jwt:
  secret: ${JWT_SECRET:}
  ttl: 1h
